<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Редагувати списки</title>
    <style>
        table { border-collapse: collapse; margin: 10px 0; }
        th, td { border: 1px solid black; padding: 5px; }
        form { display: inline; }
        input[type="text"] { margin-right: 5px; }
    </style>
</head>
<body>
    <h1>Редагувати списки</h1>
    <a href="/">Повернутися до форми</a><br><br>
    
    {% for list_name, items in lists.items() %}
        <h2>{{ list_name | capitalize }}</h2>
        <form method="POST" action="/manage_lists">
            <input type="hidden" name="list_name" value="{{ list_name }}">
            <label>Додати новий елемент: 
                <input type="text" name="value">
                <input type="hidden" name="action" value="add">
                <button type="submit">Додати</button>
            </label>
        </form>
        <table>
            <tr><th>Елемент</th><th>Дії</th></tr>
            {% for item in items %}
                <tr>
                    <td>{{ item }}</td>
                    <td>
                        <form method="POST" action="/manage_lists">
                            <input type="hidden" name="list_name" value="{{ list_name }}">
                            <input type="hidden" name="index" value="{{ loop.index0 }}">
                            <input type="text" name="value" value="{{ item }}">
                            <input type="hidden" name="action" value="edit">
                            <button type="submit">Редагувати</button>
                        </form>
                        <form method="POST" action="/manage_lists">
                            <input type="hidden" name="list_name" value="{{ list_name }}">
                            <input type="hidden" name="index" value="{{ loop.index0 }}">
                            <input type="hidden" name="action" value="delete">
                            <button type="submit">Видалити</button>
                        </form>
                    </td>
                </tr>
            {% endfor %}
        </table>
    {% endfor %}
</body>
</html>
